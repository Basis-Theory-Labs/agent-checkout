<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout · Halden</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231c1b19'/></svg>" />
    <style>
      :root {
        --paper: #f5f3ee;
        --card: #ffffff;
        --ink: #1c1b19;
        --muted: #6f6b63;
        --rule: #e4e0d7;
        --field: #faf9f6;
        --focus: #1c1b19;
        --ok: #2f6b3a;
        --bad: #a3352b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 24px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand { font-weight: 650; letter-spacing: 0.24em; font-size: 13px; }
      .secure { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
      main {
        max-width: 960px;
        margin: 0 auto;
        padding: 40px 24px 64px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
      }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
      h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 20px; }
      section { background: var(--card); border-radius: 18px; padding: 28px; box-shadow: 0 1px 0 var(--rule); }
      .item { display: flex; gap: 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); }
      .item:first-of-type { padding-top: 0; }
      .thumb { width: 56px; height: 56px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; flex-shrink: 0; }
      .line-item-name { flex: 1; }
      .price { font-variant-numeric: tabular-nums; }
      .row { display: flex; justify-content: space-between; padding: 6px 0; color: var(--muted); }
      .row.total { color: var(--ink); font-weight: 600; font-size: 18px; padding-top: 14px; margin-top: 8px; border-top: 1px solid var(--rule); }
      label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
      input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: var(--field);
        font: inherit;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        outline: none;
      }
      input:focus { border-color: var(--focus); background: #fff; }
      .field { margin-bottom: 16px; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 14px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: progress; }
      #result { min-height: 24px; margin-top: 16px; font-size: 14px; }
      #result.ok { color: var(--ok); }
      #result.bad { color: var(--bad); }
      footer { text-align: center; color: var(--muted); font-size: 12px; padding-bottom: 32px; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">HALDEN</span>
      <span class="secure">
        <svg width="12" height="14" viewBox="0 0 12 14" aria-hidden="true"><rect x="1" y="6" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 6V4a2.5 2.5 0 015 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        Secure checkout
      </span>
    </header>

    <main>
      <section aria-labelledby="summary">
        <h1 id="summary">Your order</h1>
        <div id="items"></div>
        <div class="row"><span>Subtotal</span><span class="price" id="subtotal"></span></div>
        <div class="row"><span>Shipping</span><span class="price" id="shipping"></span></div>
        <div class="row total"><span>Total</span><span class="price" id="order-total"></span></div>
      </section>

      <section aria-labelledby="payment">
        <h1 id="payment">Payment</h1>
        <form id="checkout" autocomplete="off" novalidate>
          <div class="field">
            <label for="card-number">Card number</label>
            <input id="card-number" inputmode="numeric" placeholder="1234 1234 1234 1234" />
          </div>
          <div class="pair">
            <div class="field">
              <label for="card-expiry">Expiry</label>
              <input id="card-expiry" inputmode="numeric" placeholder="MM / YY" />
            </div>
            <div class="field">
              <label for="card-cvc">Security code</label>
              <input id="card-cvc" inputmode="numeric" placeholder="CVC" />
            </div>
          </div>
          <button id="place-order" type="submit">Place order</button>
          <div id="result" role="status" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <footer>A demonstration store. Nothing is shipped and no card is charged.</footer>

    <script>
      const HEADPHONES_ICON = `<svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#1c1b19" stroke-width="1.6" aria-hidden="true"><path d="M5 18v-3a10 10 0 0120 0v3"/><rect x="3.5" y="17" width="5" height="8" rx="2"/><rect x="21.5" y="17" width="5" height="8" rx="2"/></svg>`;
      const ITEMS = [{ name: "Wireless headphones", cents: 4200 }];
      const SHIPPING = 0;
      const money = (cents) => `$${(cents / 100).toFixed(2)}`;
      const subtotal = ITEMS.reduce((sum, item) => sum + item.cents, 0);
      const total = subtotal + SHIPPING;

      document.getElementById("items").innerHTML = ITEMS.map(
        (item) => `
          <div class="item">
            <div class="thumb">${HEADPHONES_ICON}</div>
            <span class="line-item-name">${item.name}</span>
            <span class="price">${money(item.cents)}</span>
          </div>`,
      ).join("");
      document.getElementById("subtotal").textContent = money(subtotal);
      document.getElementById("shipping").textContent = SHIPPING ? money(SHIPPING) : "Free";
      document.getElementById("order-total").textContent = money(total);

      document.getElementById("checkout").addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = document.getElementById("place-order");
        const result = document.getElementById("result");
        const [exp_month, exp_year] = value("card-expiry").split("/").map((part) => part.trim());

        button.disabled = true;
        result.className = "";
        result.textContent = "";

        try {
          const response = await fetch("/api/pay", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              card: { number: value("card-number").replace(/\s/g, ""), exp_month, exp_year, cvc: value("card-cvc") },
              items: ITEMS.map((item) => item.name),
              amount_minor_units: total,
              currency: "USD",
            }),
          });
          const outcome = await response.json();
          result.className = response.ok ? "ok" : "bad";
          result.textContent = outcome.message;
        } catch {
          result.className = "bad";
          result.textContent = "Payment could not be processed.";
        } finally {
          button.disabled = false;
        }
      });

      function value(id) {
        return document.getElementById(id).value.trim();
      }
    </script>
  </body>
</html>
